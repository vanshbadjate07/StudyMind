server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip the text assets. The JS bundle is ~410KB raw and ~118KB gzipped,
    # which is the difference between a fast and a slow first load on a
    # phone connection.
    gzip             on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # Vite fingerprints every asset filename, so they can be cached
    # permanently. index.html must NOT be, or a browser keeps serving the old
    # one and loads asset URLs that no longer exist after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are routes, not missing files, so they
    # fall back to index.html rather than returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
